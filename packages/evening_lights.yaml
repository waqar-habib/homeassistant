# Evening lights: all lights on at sunset, except the Nursery.
# Requested by owner 2026-11-14. The Nursery exclusion uses the HA area, so new
# lights in other areas are included automatically.

automation:
  - id: evening_all_lights_on_at_sunset
    alias: "Evening: all lights on at sunset except Nursery"
    description: "At sunset, if someone is home, turn on every light outside the Nursery area (the Porch is handled by the outdoor package)."
    mode: single
    trace:
      stored_traces: 20
    triggers:
      - trigger: sun
        event: sunset
        offset: "0:00:00"
    conditions:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
    actions:
      - action: light.turn_on
        target:
          entity_id: >-
            {{ states.light
               | map(attribute='entity_id')
               | reject('in', area_entities('Nursery'))
               | reject('eq', 'light.smart_wi_fi_light_switch')
               | list }}
