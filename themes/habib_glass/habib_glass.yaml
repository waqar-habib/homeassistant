# Habib Glass: dark evergreen theme for the Habib glass dashboards (D70).
# Applied per view with `theme: Habib Glass`, so other dashboards and the owner's
# profile theme (Material You) are not affected. Fonts are self-hosted in /local/habib/fonts.
Habib Glass:
  primary-font-family: '"Habib Text", Inter, system-ui, -apple-system, sans-serif'
  paper-font-common-base_-_font-family: '"Habib Text", Inter, system-ui, sans-serif'
  primary-color: "#ffc978"
  accent-color: "#9fd6b5"
  primary-text-color: "#eef4ee"
  secondary-text-color: "rgba(238, 244, 238, 0.62)"
  text-primary-color: "#16241b"
  disabled-text-color: "rgba(238, 244, 238, 0.38)"
  divider-color: "rgba(255, 255, 255, 0.12)"
  primary-background-color: "#0f1c15"
  secondary-background-color: "#1a2d22"
  lovelace-background: "center / cover no-repeat fixed url('/local/habib/bg/evergreen.svg'), #12221a"
  app-header-background-color: "rgba(15, 28, 21, 0.55)"
  app-header-text-color: "#eef4ee"
  app-header-border-bottom: "none"
  card-background-color: "rgba(30, 50, 39, 0.72)"
  ha-card-background: "rgba(255, 255, 255, 0.08)"
  ha-card-border-radius: "26px"
  ha-card-border-color: "rgba(255, 255, 255, 0.14)"
  ha-card-box-shadow: "inset 0 1px 0 rgba(255,255,255,.16), 0 18px 40px -18px rgba(0,0,0,.55)"
  ha-dialog-surface-background: "#1c3126"
  mdc-theme-surface: "#1c3126"
  ha-color-primary-50: "#ffc978"
  state-icon-color: "#cfe0d4"
  state-light-active-color: "#ffc978"
  state-climate-heat-color: "#ffb36b"
  state-climate-cool-color: "#8fc9ff"
  sidebar-background-color: "#0f1c15"
  sidebar-text-color: "#cfe0d4"
  sidebar-icon-color: "rgba(238, 244, 238, 0.62)"
  sidebar-selected-text-color: "#ffc978"
  sidebar-selected-icon-color: "#ffc978"
  input-fill-color: "rgba(255,255,255,0.06)"
  switch-checked-color: "#ffc978"
  slider-color: "#ffc978"
  rgb-primary-color: "255, 201, 120"
  rgb-accent-color: "159, 214, 181"
  rgb-primary-text-color: "238, 244, 238"
  rgb-text-primary-color: "22, 36, 27"
  rgb-card-background-color: "30, 50, 39"
  code-editor-background-color: "#132219"
