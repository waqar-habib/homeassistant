# One-time: re-enable the two evening light automations at 00:01 CST on 2026-11-18.
# Requested by owner 2026-11-17 after turning them off for that day.
# The date condition keeps this from running on any other day, and the automation
# turns itself off after it runs, so it never fires again.

automation:
  - id: evening_reenable_once_2026_11_18
    alias: "One-time: re-enable evening lights on 2026-11-18"
    description: "At 00:01 on 2026-11-18, turn the two evening light automations back on, then turn this automation off."
    mode: single
    triggers:
      - trigger: time
        at: "00:01:00"
    conditions:
      - condition: template
        value_template: "{{ now().strftime('%Y-%m-%d') == '2026-11-18' }}"
    actions:
      - action: automation.turn_on
        target:
          entity_id:
            - automation.evening_all_lights_on_at_sunset_except_nursery
            - automation.evening_away_lights_on_for_2_hours_when_no_one_is_home
      - action: automation.turn_off
        target:
          entity_id: automation.one_time_re_enable_evening_lights_on_2026_11_18
        data:
          stop_actions: false
