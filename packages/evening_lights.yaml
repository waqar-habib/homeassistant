# Evening lights: all lights on at sunset, except the Nursery.
# Requested by owner 2026-11-14. The Nursery exclusion uses the HA area, so new
# lights in other areas are included automatically.

# Skip switch (owner request 2026-11-25): turn input_boolean.skip_evening_lights ON to skip
# tonight's sunset run (for example when sleeping at sunset). It clears itself at 03:00.
input_boolean:
  skip_evening_lights:
    name: Skip evening lights tonight
    icon: mdi:lightbulb-off-outline

automation:
  - id: skip_evening_lights_reset
    alias: "Evening: clear the skip switch at 03:00"
    description: "Turns the skip switch off every night so the next sunset runs normally."
    mode: single
    triggers:
      - trigger: time
        at: "03:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.skip_evening_lights

  - id: evening_all_lights_on_at_sunset
    alias: "Evening: all lights on at sunset except Nursery"
    description: "At sunset, if someone is home, turn on every light outside the Nursery area (the Porch is handled by the outdoor package)."
    mode: single
    trace:
      stored_traces: 20
    triggers:
      - trigger: sun
        event: sunset
        offset: "0:00:00"
    conditions:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - condition: state
        entity_id: input_boolean.skip_evening_lights
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id: >-
            {{ states.light
               | map(attribute='entity_id')
               | reject('in', area_entities('Nursery'))
               | reject('eq', 'light.smart_wi_fi_light_switch')
               | list }}
      # Upstairs smart-plug lamps (I53, owner GREEN LIGHT 2026-11-25). Plugs are in the
      # switch domain, so they need their own action.
      - action: switch.turn_on
        target:
          entity_id:
            - switch.upstairs_guest_guest_nightstand
            - switch.study_study_floor_lamp
